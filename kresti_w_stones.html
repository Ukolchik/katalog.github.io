const gallery = document.getElementById("gallery");
let cart = JSON.parse(localStorage.getItem("cart")) || [];
const cartCount = document.getElementById("cart-count");

function updateCartCount(){ cartCount.textContent = cart.reduce((a,b)=>a+b.qty,0); }

let currentProduct = null;

function openProductModal(src, name){
  currentProduct = name;
  document.getElementById("productImg").src = src;
  document.getElementById("productTitle").textContent = name;
  document.getElementById("productQty").value = 0;
  document.getElementById("productModal").style.display = "flex";
}

function closeProductModal(){ document.getElementById("productModal").style.display = "none"; }

document.getElementById("productAddBtn").onclick = () => {
  let qty = parseInt(document.getElementById("productQty").value);
  if(qty<=0) return;
  let item = cart.find(i=>i.name===currentProduct);
  if(item){ item.qty += qty; }
  else{ cart.push({name: currentProduct, qty}); }
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();
  //closeProductModal();
};

imageFiles.forEach(file=>{
  const rawName = file.replace(/\.[^/.]+$/,"");
  const displayName = rawName.replace(/[_ ]/,'<br>');
  const cleanName = rawName.replace(/_/g,' ');
  const src = `images/каменка/${file}`;
  const item = document.createElement("div");
  item.className="item";
  item.innerHTML = `<img src="${src}" alt="${rawName}" onclick="openProductModal('${src}','${cleanName}')"><p>${displayName}</p>`;
  gallery.appendChild(item);
});

window.onscroll = () => {
  document.getElementById("topBtn").style.display = document.documentElement.scrollTop>300 ? "block":"none";
}
function scrollToTop(){ window.scrollTo({top:0,behavior:'smooth'}); }

updateCartCount();
